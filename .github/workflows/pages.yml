# Kiểm tra app rồi đăng lên GitHub Pages mỗi khi đẩy bản mới lên nhánh main.
# Bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Kiểm tra & đăng app

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  kiem-tra:
    name: Cửa kiểm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and verify
        env:
          VITE_BASE_PATH: /Nghe-oi-doc-nao/
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify student and teacher flows against isolated test APIs
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist

  dang:
    name: Đăng GitHub Pages
    needs: kiem-tra
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
